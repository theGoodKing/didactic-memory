# .github/workflows/update_scores.yml

name: Update Geoguessr Scores

on:
  workflow_dispatch:
  schedule:
    # Cron is UTC; the script itself enforces the Europe/London start/cutoff windows.
    - cron: "17 7-17 * * 1-5"
    # Extra runs shortly before the Friday 15:00 London cutoff (covers both GMT and BST).
    - cron: "45 13,14 * * 5"

concurrency:
  group: update-scores
  cancel-in-progress: false

jobs:
  update-scores:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape active challenges and rebuild site data
        env:
          GEOGUESSR_SESSION_TOKEN: ${{ secrets.GEOGUESSR_SESSION_TOKEN }}
        run: python -m scraper

      - name: Commit and push if data changed
        if: success() || failure()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Update geoguessr league data"
          file_pattern: "docs/data.json data/raw/**"
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"
          commit_author: "GitHub Actions Bot <actions@github.com>"
